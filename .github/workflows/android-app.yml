name: Android app (Color Me! Paint)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['app/**', 'paint/**', '.github/workflows/android-app.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK (for testing on a phone)
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: color-me-paint-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
