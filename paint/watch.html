<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Watch Mia</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<script>
// Plays Mia's YouTube playlist inside the Color Me! app (the app shows this page in a frame, so the child never leaves it).
// YouTube's privacy-enhanced player; the channel is "made for kids", so YouTube shows no personalized ads.
(function () {
  var list = (new URLSearchParams(location.search).get('list') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  if (!list) return;
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=' + list + '&rel=0&playsinline=1&modestbranding=1';
  f.title = 'Mia on YouTube';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  document.body.appendChild(f);
})();
</script>
</body></html>
